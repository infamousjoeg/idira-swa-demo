<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praetor Logistics — shipment lookup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="split">
  <!-- Left pane: the fictional consumer surface -->
  <section class="pane pane--portal" aria-label="Praetor Logistics shipment lookup">
    <header class="lockup">
      <span class="lockup__mark">Idira</span>
      <span class="lockup__sig">BY PALO ALTO NETWORKS</span>
    </header>
    <h1 class="headline">Workloads with real identity.</h1>
    <p class="lede">Resolve a shipment using credentials the workload doesn't carry.</p>

    <form id="resolveForm" class="resolve" novalidate>
      <label for="shipmentId" class="resolve__label">Shipment ID</label>
      <input id="shipmentId" name="shipment_id" type="text" autocomplete="off"
        value="SHP-2049-883" required pattern="SHP-[A-Za-z0-9-]+">
      <button type="submit" class="cta">RESOLVE SECRET</button>
    </form>

    <div id="result" class="result" aria-live="polite"></div>
    <section id="evidence" class="evidence" hidden aria-live="polite">
      <span class="evidence__eyebrow">Trust evidence</span>
      <p class="evidence__line" data-slot="line1"></p>
      <p class="evidence__line" data-slot="line2"></p>
      <p class="evidence__line" data-slot="line3"></p>
      <p class="evidence__sub">See the live trust diagram &rarr;</p>
    </section>
  </section>

  <!-- Right pane: live SPIFFE trust diagram (M4) -->
  <aside class="pane pane--inspector" aria-label="Live SPIFFE trust diagram">
    <header class="inspector__head">
      <span class="inspector__eyebrow">Idira inspector</span>
      <span class="inspector__sub">spiffe / mtls / jwt-svid</span>
      <div id="pace-control" class="pace-control"></div>
    </header>
    <div id="diagram" class="diagram" aria-live="polite"></div>
  </aside>
</div>
<script type="module" src="ttl-ticker.js"></script>
<script type="module" src="pace-queue.js"></script>
<script type="module" src="pacing-control.js"></script>
<script type="module" src="portal.js"></script>
<script type="module" src="diagram.js"></script>
<script type="module" src="evidence.js"></script>
</body>
</html>
