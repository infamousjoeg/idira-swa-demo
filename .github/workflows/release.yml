# Publish container images to ghcr.io on every v*.*.* tag push.
#
# - Builds linux/amd64 + linux/arm64 for portal, carrier, acme-carrier.
# - Tags each image with the git tag (vX.Y.Z) and 'latest'.
# - Uses the workflow's GITHUB_TOKEN; no PAT, no repo secrets required.
# - Public GHCR images are free egress/storage (this workflow costs nothing
#   on a public repo).
#
# To cut a release: `git tag v1.2.0 && git push origin v1.2.0`. The workflow
# does the rest. The first push from this workflow auto-links the packages
# to this repository via the OCI source label baked into each Dockerfile.

name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.0). Used only for workflow_dispatch.'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - portal
          - carrier
          - acme-carrier
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
          # Cache against the previously-pushed :latest so re-tags re-use layers.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
          cache-to: type=inline
